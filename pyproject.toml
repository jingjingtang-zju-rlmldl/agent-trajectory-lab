[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trajectory-lab"
version = "0.1.0"
description = "CPU-first audits and numerical experiments for agent RL trajectories"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
trajectory-lab = "trajectory_lab.cli:main"

[tool.setuptools.packages.find]
include = ["trajectory_lab*"]
